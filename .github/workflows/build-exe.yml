name: Build Windows Executable

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compile TypeScript & Assets
        run: npm run build

      - name: Build Windows Executable (.exe)
        run: npx electron-builder --win --x64 --ia32
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ANSTOOL-Windows-EXE
          path: |
            release/*.exe
            release/*.blockmap

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "ANSTOOL v2.0.0 - 1-Click Game Unlocker (x64 & 32-bit)"
          body: |
            ### ⚡ ANSTOOL v2.0.0 (1-Click Instant Install Edition)
            - 📦 **Dual Architecture Support**: Includes both **64-bit (x64)** and **32-bit (ia32)** Setup Installers and Portable EXEs!
            - 🎮 **Ultra-Simple Minimalist UI**: No complex buttons or confusing modes — Search Game -> Click Add -> Done ✅
            - 🛡️ **Hook & License Fix**: Deploys full OpenSteamTool core hook suite (`OpenSteamTool.dll`, `dwmapi.dll`, `xinput1_4.dll`), resolving the "No licenses" / Steam installation failed error!
            - 📂 **Multi-Directory Lua Sync**: Deploys Lua unlock scripts across `config/stplug-in/`, `stplug-in/`, and `config/lua/` with depot key bindings.
            - 🚀 **Official Steam Store Search & DLC Auto-Detection**
            - 📥 **Native `steam://install/<AppID>` auto-launch**
            - 🛡️ **Zero Admin Friction**: Runs as standard user without UAC prompts (`asInvoker`).
          draft: false
          prerelease: false
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
