name: Build Windows Executable

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compile TypeScript & Assets
        run: npm run build

      - name: Build Windows Executable (.exe)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ANSTOOL-Windows-EXE
          path: |
            release/*.exe
            release/*.blockmap

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "ANSTOOL v2.0.0 - 1-Click Game Unlocker"
          body: |
            ### ⚡ ANSTOOL v2.0.0 (1-Click Instant Install Edition)
            - 🎮 Ultra-Simple Minimalist UI: No complex buttons or confusing modes
            - ⚡ 1-Click Install Flow: Search Game -> Click Add -> Done ✅
            - 🛡️ Silent Auto-Hook: Automatically deploys proxy DLLs in background
            - 🚀 Official Steam Store Search & DLC Auto-Detection
            - 📥 Native `steam://install/<AppID>` auto-launch
          draft: false
          prerelease: false
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
